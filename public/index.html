<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex Usage</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("codexUsageTheme");
          const fallback = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = saved || fallback;
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Codex Usage</h1>
          <p id="autoRefreshStatus" class="auto-refresh-status" aria-live="polite"><span class="auto-refresh-label">自动刷新</span><button id="autoRefreshToggle" type="button" aria-pressed="true">开</button><span id="autoRefreshInterval">每 60 秒</span><span id="lastSuccessfulCheck">上次成功检查：尚无</span><span id="autoRefreshError" class="auto-refresh-error"></span></p>
        </div>
        <div class="topbar-actions">
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题" aria-pressed="false">浅色/深色</button>
          <button id="importButton" type="button">导入目录</button>
        </div>
      </header>

      <section class="toolbar" aria-label="筛选">
        <div class="control-group">
          <span>范围</span>
          <div class="segmented" id="presetButtons">
            <button type="button" data-preset="today" class="active">今日</button>
            <button type="button" data-preset="week">本周</button>
            <button type="button" data-preset="month">本月</button>
            <button type="button" data-preset="all">全部</button>
            <div class="recent-segment" data-preset="recent">
              <span class="recent-segment-label">最近</span>
              <span class="recent-combobox">
                <input
                  id="recentValue"
                  class="recent-segment-input"
                  type="text"
                  value="1个月"
                  autocomplete="off"
                  aria-label="最近范围"
                  aria-controls="recentRangeMenu"
                  aria-expanded="false"
                  aria-haspopup="listbox"
                />
                <button
                  id="recentMenuButton"
                  class="recent-menu-button"
                  type="button"
                  aria-label="展开最近范围选项"
                  aria-controls="recentRangeMenu"
                  aria-expanded="false"
                >
                </button>
              </span>
              <div id="recentRangeMenu" class="recent-range-menu" role="listbox" hidden>
                <button type="button" role="option" data-recent-option="1天" aria-selected="false">1天</button>
                <button type="button" role="option" data-recent-option="1周" aria-selected="false">1周</button>
                <button type="button" role="option" data-recent-option="1个月" aria-selected="true">1个月</button>
                <button type="button" role="option" data-recent-option="2个月" aria-selected="false">2个月</button>
                <button type="button" role="option" data-recent-option="3个月" aria-selected="false">3个月</button>
                <button type="button" role="option" data-recent-option="半年" aria-selected="false">半年</button>
                <button type="button" role="option" data-recent-option="一年" aria-selected="false">一年</button>
              </div>
            </div>
            <button type="button" data-preset="custom">自定义</button>
          </div>
        </div>
        <div class="control-group custom-range">
          <label>
            开始
            <span class="date-input-wrap">
              <input id="startDate" type="text" autocomplete="off" inputmode="numeric" placeholder="年/月/日" />
              <button
                class="date-picker-button"
                type="button"
                data-date-picker-button="start"
                aria-label="打开开始日期日历"
                aria-controls="startDatePicker"
                aria-expanded="false"
              ></button>
              <div id="startDatePicker" class="date-picker-popover" data-date-picker="start" hidden></div>
            </span>
          </label>
          <label>
            结束
            <span class="date-input-wrap">
              <input id="endDate" type="text" autocomplete="off" inputmode="numeric" placeholder="年/月/日" />
              <button
                class="date-picker-button"
                type="button"
                data-date-picker-button="end"
                aria-label="打开结束日期日历"
                aria-controls="endDatePicker"
                aria-expanded="false"
              ></button>
              <div id="endDatePicker" class="date-picker-popover" data-date-picker="end" hidden></div>
            </span>
          </label>
        </div>
        <div class="control-group">
          <label>
            粒度
            <select id="bucketSelect">
              <!-- 小时粒度用于今日视图展示日内用量变化。 -->
              <option value="hour" selected>按小时</option>
              <option value="day">按天</option>
              <option value="week">按周</option>
              <option value="month">按月</option>
            </select>
          </label>
        </div>
      </section>

      <section class="metrics" aria-label="总览">
        <article class="metric">
          <span>总 tokens</span>
          <strong id="totalTokens">-</strong>
        </article>
        <article class="metric">
          <span>总输入</span>
          <strong id="inputTokens">-</strong>
        </article>
        <article class="metric">
          <span>缓存读取</span>
          <strong id="cachedTokens">-</strong>
        </article>
        <article class="metric">
          <span>输出</span>
          <strong id="outputTokens">-</strong>
        </article>
        <article class="metric">
          <span>推理输出</span>
          <strong id="reasoningTokens">-</strong>
        </article>
        <article class="metric">
          <span>会话</span>
          <strong id="sessionCount">-</strong>
        </article>
      </section>

      <section class="metrics price-metrics" aria-label="API 费用估算">
        <article class="metric">
          <span>总花销</span>
          <strong id="totalCost">—</strong>
        </article>
        <article class="metric">
          <span>普通输入</span>
          <strong id="inputCost">—</strong>
        </article>
        <article class="metric">
          <span>缓存读取</span>
          <strong id="cachedInputCost">—</strong>
        </article>
        <article class="metric">
          <span>输出</span>
          <strong id="outputCost">—</strong>
        </article>
        <article class="metric">
          <span>命中率</span>
          <strong id="cacheHitRate">—</strong>
        </article>
        <article class="metric">
          <span>模型数量</span>
          <strong id="priceModelCount">—</strong>
        </article>
      </section>
      <p id="costEstimateNote" class="cost-estimate-note" aria-live="polite"></p>

      <section id="comparisonSummary" class="comparison-strip" aria-label="趋势变化"></section>

      <section class="main-grid">
        <section class="panel chart-panel">
          <div class="panel-heading timeline-heading">
            <div class="timeline-title">
              <h2>时间分布</h2>
              <span id="rangeLabel"></span>
            </div>
            <div class="segmented timeline-mode-select" id="timelineModes" role="group" aria-label="时间分布方式">
              <button type="button" data-timeline-mode="channel" aria-pressed="true">按渠道</button>
              <button type="button" data-timeline-mode="model" aria-pressed="false">按模型</button>
              <button type="button" data-timeline-mode="cost" aria-pressed="false">按花销</button>
            </div>
          </div>
          <canvas id="timelineChart" width="960" height="320" tabindex="0" role="img" aria-label="时间分布柱状图；聚焦后可查看用量详情"></canvas>
          <div id="timelineLegend" class="timeline-legend" aria-label="图表图例"></div>
        </section>

        <section class="panel channel-panel">
          <div class="panel-heading">
            <h2>渠道分布</h2>
          </div>
          <div id="channelList" class="bar-list"></div>
        </section>
      </section>

      <section class="period-comparison-grid" aria-label="跨时间范围用量对比">
        <section class="panel period-comparison-panel">
          <div class="panel-heading period-comparison-heading">
            <div>
              <h2>按模型</h2>

              <p class="comparison-as-of" data-comparison-as-of></p>
            </div>
            <input id="modelComparisonSearch" type="search" autocomplete="off" placeholder="搜索模型" aria-label="搜索模型用量对比" />
          </div>
          <div id="modelComparisonTable" class="period-comparison-table" aria-live="polite"></div>
        </section>
        <section class="panel period-comparison-panel">
          <div class="panel-heading period-comparison-heading">
            <div>
              <h2>按仓库</h2>

              <p class="comparison-as-of" data-comparison-as-of></p>
            </div>
            <input id="repositoryComparisonSearch" type="search" autocomplete="off" placeholder="搜索仓库" aria-label="搜索仓库用量对比" />
          </div>
          <div id="repositoryComparisonTable" class="period-comparison-table" aria-live="polite"></div>
        </section>
      </section>

      <section class="panel homes-panel">
        <div class="panel-heading">
          <h2>扫描目录</h2>
          <button id="addImportButton" class="panel-action" type="button">添加</button>
        </div>
        <div id="homeList" class="home-list"></div>
      </section>
    </main>
    <div id="importDialog" class="dialog-backdrop" hidden>
      <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="importDialogTitle">
        <form id="importForm">
          <div class="dialog-heading">
            <h2 id="importDialogTitle">导入目录</h2>
            <button id="closeImportDialogButton" class="icon-button" type="button" aria-label="关闭">×</button>
          </div>
          <p class="dialog-copy">支持 Codex home，或包含 .codex-usage/usage.jsonl 的项目目录。</p>
          <label>
            目录路径
            <div class="path-picker">
              <input id="importPath" type="text" autocomplete="off" placeholder="/Users/you/project/openai_codex" />
              <button id="pickImportDirectoryButton" type="button">选择文件夹</button>
            </div>
          </label>
          <p id="importMessage" class="dialog-message" role="status"></p>
          <div class="dialog-actions">
            <button id="cancelImportButton" type="button">取消</button>
            <button id="submitImportButton" type="submit">导入</button>
          </div>
        </form>
      </section>
    </div>
    <div id="usageTooltip" class="usage-tooltip" role="tooltip" hidden></div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
