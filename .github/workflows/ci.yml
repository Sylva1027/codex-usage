name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node-version: 22
          - os: windows-latest
            node-version: 24
          - os: ubuntu-latest
            node-version: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Set up browser checks
        if: runner.os == 'Windows'
        shell: bash
        env:
          AGENT_USAGE_PLAYWRIGHT_MODULE: ${{ runner.temp }}/agent-usage-browser/node_modules/playwright/index.mjs
        run: |
          npm install --prefix "$RUNNER_TEMP/agent-usage-browser" --no-package-lock --no-save playwright@1.62.1
          echo "AGENT_USAGE_PLAYWRIGHT_MODULE=$AGENT_USAGE_PLAYWRIGHT_MODULE" >> "$GITHUB_ENV"
      - name: Run full Windows suite
        if: runner.os == 'Windows'
        timeout-minutes: 20
        run: node --test --test-reporter=spec --test-concurrency=4 --test-timeout=600000 "test/**/*.test.js"
      - name: Run Linux core regressions
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: >-
          node --test --test-reporter=spec --test-concurrency=4 --test-timeout=120000
          test/app-autorefresh.test.js test/claude-code-usage.test.js
          test/codex-rollout-compression.test.js test/cli.test.js test/server.test.js
          test/usage-core.test.js test/usage-store.test.js test/pricing.test.js
          test/pricing-auto.test.js test/pricing-models.test.js
          test/timeline-utils.test.js test/recent-selections.test.js test/w1-executor.test.js
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
