name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Use canonical Windows temp paths
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Set up browser checks
        shell: bash
        env:
          AGENT_USAGE_PLAYWRIGHT_MODULE: ${{ runner.temp }}/agent-usage-browser/node_modules/playwright/index.mjs
        run: |
          npm install --prefix "$RUNNER_TEMP/agent-usage-browser" --no-package-lock --no-save playwright@1.62.1
          echo "AGENT_USAGE_PLAYWRIGHT_MODULE=$AGENT_USAGE_PLAYWRIGHT_MODULE" >> "$GITHUB_ENV"
      - name: Run full Windows suite
        timeout-minutes: 20
        run: node --test --test-reporter=spec --test-concurrency=4 --test-timeout=600000 "test/**/*.test.js"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
